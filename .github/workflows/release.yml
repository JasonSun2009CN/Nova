name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build Tauri
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build Tauri
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-x86_64-pc-windows-msvc
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/nova.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build Tauri
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-x86_64-unknown-linux-gnu
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error

  linux-arm64:
    name: Linux (aarch64, QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build Tauri in arm64 container
        run: |
          docker run --platform linux/arm64 -v "${{ github.workspace }}:/build" -w /build arm64v8/ubuntu:24.04 bash -c '
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xz-utils
            curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-arm64.tar.xz | tar -xJ -C /usr/local --strip-components=1
            npm install -g pnpm@8.6.0
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add aarch64-unknown-linux-gnu
            pnpm install --frozen-lockfile
            pnpm tauri build --target aarch64-unknown-linux-gnu --bundles appimage,deb
          '
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-aarch64-unknown-linux-gnu
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
